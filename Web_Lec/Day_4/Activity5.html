<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Document</title>
  </head>
  <body>
    <script>
      var area = prompt("Enter the area of the land property:");

      if (area <= 100) {
        alert("Price is $10000");
      } else if (area >= 101 && area <= 200) {
        alert("Price is $15000");
      } else {
        alert("Price is $20000");
      }
    </script>
  </body>
</html>

    <title>Weekly Class Timetable</title>

        <tr>

          <td style="padding: 10px">Mathematics</td>
          <td style="padding: 10px">Web Development</td>
        </tr>
        <tr>
          <td style="padding: 10px">Tuseday</td>

          <td style="padding: 10px">English</td>
          <td style="padding: 10px">Mathematics</td>
          <td style="padding: 10px">Web Development</td>
        </tr>
        <tr>
          <td style="padding: 10px">Wednesday</td>
          <td style="padding: 10px">Programming</td>
          <td style="padding: 10px">Database</td>
          <td style="padding: 10px">English</td>
          <td style="padding: 10px">Lab Session</td>
        </tr>
        <tr>
          <td style="padding: 10px">Thursday</td>
          <td colspan="2" ,style="padding: 10px;">Lab Session</td>
          <td style="padding: 10px">Mathematics</td>
          <td style="padding: 10px">Database</td>
        </tr>
      </table>
    </div>
  </body>
</html>
